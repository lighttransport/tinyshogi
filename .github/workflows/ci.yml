name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native test tools
        run: sudo apt-get update && sudo apt-get install -y clang meson ninja-build
      - name: Run native regression suite
        run: ./scripts/run_regression.sh
      - name: Run fuzz smoke test
        run: RUN_FUZZ=1 FUZZ_SECONDS=10 ./scripts/run_regression.sh
      - name: Build CPU NNUE trainer
        run: |
          make -C cpu train-nnue
          python3 tools/prepare_nnue.py selfplay-tiny-yaneuraou.jsonl \
            -o /tmp/tinyshogi-ci.ndf1 --limit 8
          cpu/train_nnue /tmp/tinyshogi-ci.ndf1 /tmp/tinyshogi-ci.nnue 1 0.01

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript
        working-directory: web
        run: |
          node --check app.js
          node --check engine-worker.js
